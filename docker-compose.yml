version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise_rag_api
    command: uvicorn 02_enterprise_production_rag.api.app:app --host 0.0.0.0 --port 8000 --workers 1
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PYTHONPATH=/app/02_enterprise_production_rag
    volumes:
      - ./02_enterprise_production_rag/data:/app/02_enterprise_production_rag/data
      - hf_model_cache:/root/.cache/huggingface
    networks:
      - rag_network
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise_rag_ui
    command: streamlit run 02_enterprise_production_rag/ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000/api/v1/chat
      - SESSION_CLEAR_URL=http://api:8000/api/v1/sessions
      - PYTHONPATH=/app/02_enterprise_production_rag
    depends_on:
      - api
    networks:
      - rag_network
    restart: unless-stopped

networks:
  rag_network:
    driver: bridge

volumes:
  hf_model_cache: